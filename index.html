<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GetForm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise-overlay"></div>

<header class="topbar">
  <div class="wordmark">
    <span class="wordmark-main">GetForm</span>
    <span class="wordmark-tag">recomposition log</span>
  </div>
  <div class="week-ring" id="weekRing" aria-label="Weekly training progress">
    <svg viewBox="0 0 120 120" class="ring-svg">
      <g id="ringSegments"></g>
    </svg>
    <div class="ring-center">
      <span class="ring-count" id="ringCount">0</span>
      <span class="ring-label">/4</span>
    </div>
  </div>
</header>

<main class="layout">

  <!-- TODAY -->
  <section class="panel panel-today" aria-labelledby="todayHeading">
    <div class="panel-head">
      <h1 id="todayHeading" class="panel-title">Today</h1>
      <span class="date-chip" id="dateChip"></span>
    </div>

    <div id="todayContent"></div>
  </section>

  <!-- MACROS -->
  <section class="panel panel-macros" aria-labelledby="macrosHeading">
    <div class="panel-head">
      <h2 id="macrosHeading" class="panel-title">Macros</h2>
      <span class="panel-sub">~1850 kcal target</span>
    </div>
    <div class="macro-grid" id="macroGrid"></div>
    <div class="macro-total">
      <span class="macro-total-label">Logged today</span>
      <span class="macro-total-value" id="macroTotalValue">0 <span class="unit">kcal</span></span>
    </div>
  </section>

  <!-- MEALS -->
  <section class="panel panel-meals" aria-labelledby="mealsHeading">
    <div class="panel-head">
      <h2 id="mealsHeading" class="panel-title">Meal reference</h2>
      <span class="panel-sub">tap to mark eaten</span>
    </div>
    <div class="meal-list" id="mealList"></div>
  </section>

  <!-- LOG -->
  <section class="panel panel-log" aria-labelledby="logHeading">
    <button class="collapse-trigger" id="logToggle" aria-expanded="false" aria-controls="logBody">
      <h2 id="logHeading" class="panel-title">Weekly log</h2>
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="log-body" id="logBody">
      <table class="log-table">
        <thead>
          <tr><th>Week</th><th>Bodyweight (kg)</th><th>Notes</th></tr>
        </thead>
        <tbody id="logTableBody"></tbody>
      </table>
      <button class="btn-ghost" id="addWeekBtn">+ Add week</button>
    </div>
  </section>

  <!-- FOODS -->
  <section class="panel panel-foods" aria-labelledby="foodsHeading">
    <button class="collapse-trigger" id="foodsToggle" aria-expanded="false" aria-controls="foodsBody">
      <h2 id="foodsHeading" class="panel-title">Food reference</h2>
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="foods-body" id="foodsBody"></div>
  </section>

</main>

<footer class="foot-note">
  <span>Stored locally on this device — nothing leaves your browser.</span>
  <button class="btn-text" id="resetBtn">Reset all data</button>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
